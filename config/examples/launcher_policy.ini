# Launcher policy handed out over the authentication channel (action kPolicy).
# The launcher asks for it before a launch and passes the tables to its Frida
# bridge, which uses them to show the build-a-room mode badges.
#
# modes        every game mode the room list may offer
# crazy_modes  the subset that also gets the "crazy mode" badge
# Both lists are comma separated and duplicate-free; an empty list keeps the
# feature off. Unknown keys and malformed values stop the server at startup.
#
# Reference tables taken from the 1304 live service (2026-10-15).
modes=1,3,6,8,11,12,13,14,16,18,19,20,21,23,25,26,28,29,30,32,33,35,38,41,43,44,101,106
crazy_modes=1,3,8,11,13,28,30,32,38
